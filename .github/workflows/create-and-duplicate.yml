name: Duplicate AAMSFilesys

on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'Full URL of the destination private repo (e.g., https://github.com)'
        required: true
        type: string
      target_token:
        description: 'Your Personal Access Token (PAT) with repo/write access'
        required: true
        type: string
      text_input:
        description: 'Text content to save in AAMSGithub.txt'
        required: true
        type: string

jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Mirror Clone Source Repository (AAMSFilesys)
        run: |
          # Clones AAMSFilesys using your source repository secret
          git clone --mirror https://x-token-auth:${{ secrets.SOURCE_REPO_TOKEN }}@://github.com source-repo.git

      - name: Add AAMSGithub.txt to Mirror
        run: |
          cd source-repo.git
          
          # Clone a temporary working copy to inject the file
          cd ..
          git clone source-repo.git working-copy
          cd working-copy
          
          # Create the text file with the required name
          echo "${{ inputs.text_input }}" > "AAMSGithub.txt"
          
          # Commit and push back to our local mirror
          git add "AAMSGithub.txt"
          git commit -m "chore: save workflow input to AAMSGithub.txt"
          git push origin main

      - name: Push to Fresh Target Repository
        run: |
          cd source-repo.git
          
          # Rewrite the target URL using the token provided in the workflow input form
          TARGET_URL=$(echo "${{ inputs.target_repo_url }}" | sed 's|https://|https://x-access-token:${{ inputs.target_token }}@|')
          
          echo "Pushing mirrored contents to destination repo..."
          git push --mirror "$TARGET_URL"
