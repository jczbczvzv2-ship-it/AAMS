name: Create and Duplicate AAMSFilesys

on:
  workflow_dispatch:
    inputs:
      target_token:
        description: 'Personal access token (PAT) to create and push to the new private repo'
        required: true
        type: string
      text_input:
        description: 'Text to save into AAMSGithub.txt'
        required: true
        type: string

jobs:
  prepare-and-create:
    runs-on: ubuntu-latest
    outputs:
      username: ${{ steps.get-user.outputs.username }}
      repo_full_name: ${{ steps.create-repo.outputs.repo_full_name }}
      repo_name: ${{ steps.create-repo.outputs.repo_name }}
    steps:
      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Mask target token
        run: echo "::add-mask::${{ inputs.target_token }}"

      - name: Get authenticated username
        id: get-user
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${{ inputs.target_token }}"
          if [ -z "$TOKEN" ]; then
            echo "target_token input is empty"
            exit 1
          fi
          # retry curl a few times for transient network errors
          for i in 1 2 3; do
            USER_JSON=$(curl -fS -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/user) && break || sleep 2
          done
          USERNAME=$(echo "$USER_JSON" | jq -r '.login // empty')
          if [ -z "$USERNAME" ]; then
            echo "Failed to fetch username: $USER_JSON"
            exit 1
          fi
          echo "username=$USERNAME" >> $GITHUB_OUTPUT

      - name: Create private repository
        id: create-repo
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${{ inputs.target_token }}"
          if [ -z "$TOKEN" ]; then
            echo "target_token input is empty"
            exit 1
          fi
          # generate a 5-digit randomized code (00000-99999)
          SUFFIX=$(awk 'BEGIN {srand(); printf "%05d", int(rand()*100000)}')
          REPO_NAME="AAMSFileSys-#${SUFFIX}"
          PAYLOAD=$(jq -n --arg name "$REPO_NAME" '{name:$name,private:true}')
          for i in 1 2 3; do
            RESP=$(curl -fS -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/user/repos -d "$PAYLOAD") && break || sleep 2
          done
          FULL_NAME=$(echo "$RESP" | jq -r '.full_name // empty')
          if [ -z "$FULL_NAME" ]; then
            echo "Failed to create repo: $RESP"
            exit 1
          fi
          echo "repo_full_name=$FULL_NAME" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

  mirror-and-push:
    needs: prepare-and-create
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: jczbczvzv2-ship-it/AAMSFilesys
      SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      TARGET_TOKEN: ${{ inputs.target_token }}
      TEXT_INPUT: ${{ inputs.text_input }}
      NEW_REPO_NAME: ${{ needs.prepare-and-create.outputs.repo_name }}
      NEW_REPO_OWNER: ${{ needs.prepare-and-create.outputs.username }}
    steps:
      - name: Install git and jq
        run: |
          sudo apt-get update && sudo apt-get install -y git jq

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Mirror-clone source repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "Missing SOURCE_REPO_TOKEN secret"
            exit 1
          fi
          SRC_URL="https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}.git"
          echo "Cloning (mirror) ${SRC_URL}"
          git clone --mirror --quiet "${SRC_URL}" source.git

      - name: Create working copy and inject AAMSGithub.txt
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet source.git working
          cd working
          # pick a branch to work on (fallback to main)
          FIRST_BRANCH=$(git for-each-ref --format='%(refname:short)' refs/heads | head -n1 || true)
          if [ -n "$FIRST_BRANCH" ]; then
            git checkout "$FIRST_BRANCH" || git checkout -b "$FIRST_BRANCH"
          else
            git checkout --orphan main
            git reset --quiet
          fi

          printf '%s\n' "${TEXT_INPUT}" > AAMSGithub.txt
          git add AAMSGithub.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add AAMSGithub.txt from workflow"
          fi

      - name: Push mirror and working changes to new private repo
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TARGET_TOKEN:-}" ]; then
            echo "target_token input is empty"
            exit 1
          fi
          # URL-encode '#' so it is safe in the push URL
          ENCODED_REPO_NAME=${NEW_REPO_NAME//\#/%23}
          DEST_URL="https://x-access-token:${TARGET_TOKEN}@github.com/${NEW_REPO_OWNER}/${ENCODED_REPO_NAME}.git"
          echo "Pushing (mirror) to ${DEST_URL}"
          git -C source.git push --mirror "${DEST_URL}" || true
          # ensure the working branch (with injected file) is pushed
          BRANCH=$(git -C working rev-parse --abbrev-ref HEAD)
          git -C working push "${DEST_URL}" +HEAD:refs/heads/${BRANCH} || true
          echo "Repository pushed: https://github.com/${NEW_REPO_OWNER}/${NEW_REPO_NAME}"
