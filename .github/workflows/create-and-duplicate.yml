name: Duplicate AAMSFilesys

on:
  workflow_dispatch:
    inputs:
      target_token:
        description: 'Your GitHub Personal Access Token (needs "repo" scope)'
        required: true
        type: string
      text_input:
        description: 'Text content to save in AAMSGithub.txt'
        required: true
        type: string

jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Generate Repository Name & Create Private Repo
        id: create-repo
        run: |
          # Automatically generate a unique private repository name using the run ID
          REPO_NAME="AAMSFilesys-${{ github.run_id }}"
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          
          # Fetch the authenticated user using the token they provided in the prompt
          USER_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ inputs.target_token }}" \
                                -H "Accept: application/vnd.github+json" \
                                https://github.com)
          
          USERNAME=$(echo "$USER_RESPONSE" | jq -r '.login')
          
          if [ "$USERNAME" == "null" ] || [ -z "$USERNAME" ]; then
            echo "Error: Failed to authenticate with the provided target_token. Check your PAT."
            exit 1
          fi
          
          echo "Authenticated User: $USERNAME"
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          
          echo "Creating fresh PRIVATE repository '$REPO_NAME' for user '$USERNAME'..."
          CREATE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ inputs.target_token }}" \
            -H "Accept: application/vnd.github+json" \
            https://github.com/repos \
            -d "{\"name\":\"$REPO_NAME\",\"private\":true}")
            
          REPO_CHECK=$(echo "$CREATE_RESPONSE" | jq -r '.full_name')
          if [ "$REPO_CHECK" == "null" ] || [ -z "$REPO_CHECK" ]; then
            echo "Error creating repository:"
            echo "$CREATE_RESPONSE"
            exit 1
          fi
          echo "Successfully created private repo: $REPO_CHECK"

      - name: Mirror Clone Source Repository (AAMSFilesys)
        run: |
          # Clones AAMSFilesys using your source repository secret
          git clone --mirror https://x-token-auth:${{ secrets.SOURCE_REPO_TOKEN }}@://github.com source-repo.git

      - name: Add AAMSGithub.txt to Mirror
        run: |
          cd source-repo.git
          
          # Clone a temporary working copy to inject the file
          cd ..
          git clone source-repo.git working-copy
          cd working-copy
          
          # Create the text file with the required name
          echo "${{ inputs.text_input }}" > "AAMSGithub.txt"
          
          # Commit and push back to our local mirror
          git add "AAMSGithub.txt"
          git commit -m "chore: save workflow input to AAMSGithub.txt"
          git push origin main

      - name: Push to Fresh Target Repository
        run: |
          cd source-repo.git
          
          TARGET_USER="${{ steps.create-repo.outputs.username }}"
          REPO_NAME="${{ steps.create-repo.outputs.repo_name }}"
          
          DEST_URL="https://x-access-token:${{ inputs.target_token }}@://github.com"
          
          echo "Pushing mirrored contents to private repo $TARGET_USER/$REPO_NAME..."
          git push --mirror "$DEST_URL"
          echo "Repository successfully created and populated at: https://github.com"
